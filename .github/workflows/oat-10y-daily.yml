name: OAT 10 ans — daily fetch

on:
  schedule:
    # Tous les jours à 09:30 UTC (≈ 11:30 Paris) — après publication ECB SDW
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - bootstrap

jobs:
  fetch-oat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'psycopg[binary]' requests pandas

      - name: Fetch OAT 10 ans
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          echo "Running pipeline_oat10y.py --$MODE"
          python pipeline_oat10y.py --$MODE
