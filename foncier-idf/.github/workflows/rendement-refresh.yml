name: Refresh fact_rendement (OLAP + ANIL annual)

on:
  workflow_dispatch: {}
  schedule:
    # OLAP publie typiquement en décembre/janvier, ANIL en début d'année.
    # On lance le 31 janvier pour récupérer les deux dernières publications.
    - cron: "0 4 31 1 *"

jobs:
  refresh-rendement:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy httpx python-dotenv

      - name: Run rendement pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: ${{ github.workspace }}
        run: |
          cd ..
          python idf-foncier/pipeline_rendement.py
